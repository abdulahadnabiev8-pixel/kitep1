<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folio — Визиттик карта</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <header class="intro">
      <a class="brand" href="#">
        <span class="brand-mark">f</span>
        <span>folio<span class="dot">.</span></span>
      </a>
      <span class="label">BUSINESS CARD · 85 × 55 MM</span>
    </header>

    <section class="cards">

      <!-- Алдыңкы тарап -->
      <article class="card front">
        <div class="grain"></div>
        <div class="front-top">
          <span class="mini-logo">f</span>
          <span class="edition">EST. 2026</span>
        </div>
        <div class="front-center">
          <h1>Folio<span>.</span></h1>
          <p>BOOKS · STORIES · IDEAS</p>
        </div>
        <div class="front-bottom">
          <div>
            ONLINE BOOKSTORE<br>
            READ SLOWLY, LIVE WELL
          </div>
          <span class="book-symbol">❦</span>
        </div>
        <div class="side-rule"></div>
      </article>

      <!-- Арткы тарап -->
      <article class="card back">
        <div class="grain"></div>
        <div class="back-orbit"></div>
        <div class="back-orbit orbit-two"></div>

        <div class="back-heading">
          <span class="back-mark">f</span>
          <div>
            <strong>FOLIO BOOKSTORE</strong>
            <small>ONLINE BOOKSELLER</small>
          </div>
        </div>

        <div class="contact-list">
          <div class="contact-row">
            <span class="contact-icon">✆</span>
            <div><small>PHONE</small><strong>+996 700 000 000</strong></div>
          </div>
          <div class="contact-row">
            <span class="contact-icon">✉</span>
            <div><small>EMAIL</small><strong>hello@folio.kg</strong></div>
          </div>
          <div class="contact-row">
            <span class="contact-icon">⌂</span>
            <div><small>WEB</small><strong>www.folio.kg</strong></div>
          </div>
        </div>

        <div class="back-bottom">
          <span>FOLIO.KG</span>
          <span class="barcode"></span>
        </div>
      </article>

    </section>

    <footer class="note">
      <span>Басып чыгаруу үчүн: Ctrl + P</span>
      <a href="#" onclick="window.print(); return false;">Басып чыгаруу →</a>
    </footer>

  </main>
</body>
</html>
